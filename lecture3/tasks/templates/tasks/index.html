{% extends "tasks/layout.html" %}
{% load static %}

{% block body %}
    <h1>Tasks</h1>
    
    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% empty %}
            <li>No tasks.</li>
        {% endfor %}
    </ul>
    <a class="add-task" href="{% url 'tasks:add' %}">Add a New Task</a>
{% endblock %}
