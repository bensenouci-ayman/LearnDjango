{% extends "tasks/layout.html" %}

{% block body %}
    <h1>Add Task</h1>
    
    <form action="{% url 'tasks:add' %}" method="post">

        {% csrf_token %}
        {{ form }}

        <input 
        type="submit"
        value="Add"
        >

    </form>
    <!-- name space collesion may happen below without using app_name -->
    <a class="view-tasks" href="{% url 'tasks:index' %}">View Tasks</a>
{% endblock %}
